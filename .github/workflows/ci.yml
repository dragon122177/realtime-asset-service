name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, PostgreSQL, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forgeflow_test
          POSTGRES_USER: forgeflow
          POSTGRES_PASSWORD: forgeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgeflow -d forgeflow_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://forgeflow:forgeflow@localhost:5432/forgeflow_test
      TEST_DATABASE_URL: postgres://forgeflow:forgeflow@localhost:5432/forgeflow_test
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      STORAGE_DRIVER: filesystem
      STORAGE_ROOT: /tmp/forgeflow-ci-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage and PostgreSQL
        run: npm run test:coverage
      - name: Verify migrations and synthetic seed
        run: npm run db:migrate && npm run db:seed
      - name: Build production artifacts
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  container-builds:
    name: Container builds
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API and worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: forgeflow-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: forgeflow-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

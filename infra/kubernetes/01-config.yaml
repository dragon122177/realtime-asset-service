apiVersion: v1
kind: ConfigMap
metadata:
  name: forgeflow-config
  namespace: forgeflow
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: '8080'
  LOG_LEVEL: info
  CORS_ORIGIN: https://forgeflow.example.com
  JWT_EXPIRES_IN: 8h
  LIVE_TICKET_TTL_SECONDS: '60'
  STORAGE_DRIVER: s3
  S3_ENDPOINT: https://objects.example.com
  S3_REGION: ap-northeast-1
  S3_BUCKET: forgeflow-assets
  S3_USE_SSL: 'true'
  MAX_UPLOAD_BYTES: '52428800'
  WORKER_POLL_MS: '1000'
  WORKER_METRICS_PORT: '9092'
  WORKER_MAX_ATTEMPTS: '4'
  PROCESSOR_VERSION: forgeflow-analyzer-1.0.0

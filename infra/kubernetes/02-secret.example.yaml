# Example only. Create this object with External Secrets, Sealed Secrets,
# or a cloud secret manager. Never commit real deployment values.
apiVersion: v1
kind: Secret
metadata:
  name: forgeflow-secrets
  namespace: forgeflow
type: Opaque
stringData:
  DATABASE_URL: postgres://replace-me
  REDIS_URL: rediss://replace-me
  JWT_SECRET: replace-with-at-least-32-random-characters
  S3_ACCESS_KEY: replace-me
  S3_SECRET_KEY: replace-me

apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeflow-api
  namespace: forgeflow
  labels: &labels
    app.kubernetes.io/name: forgeflow-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: forgeflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: forgeflow-api
  template:
    metadata:
      labels: *labels
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: forgeflow-api
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrations
          image: ghcr.io/dragon122177/forgeflow-api:latest
          command: ['node', 'apps/api/dist/commands/migrate.js']
          envFrom:
            - configMapRef: { name: forgeflow-config }
            - secretRef: { name: forgeflow-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
            readOnlyRootFilesystem: true
      containers:
        - name: api
          image: ghcr.io/dragon122177/forgeflow-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: forgeflow-config }
            - secretRef: { name: forgeflow-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 150m, memory: 192Mi }
            limits: { cpu: 750m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: forgeflow
spec:
  selector:
    app.kubernetes.io/name: forgeflow-api
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgeflow-api
  namespace: forgeflow
automountServiceAccountToken: false

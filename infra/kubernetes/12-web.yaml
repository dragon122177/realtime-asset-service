apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeflow-web
  namespace: forgeflow
  labels: &labels
    app.kubernetes.io/name: forgeflow-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: forgeflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: forgeflow-web
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/dragon122177/forgeflow-web:latest
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
        - name: cache
          emptyDir: { sizeLimit: 32Mi }
        - name: run
          emptyDir: { sizeLimit: 8Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: forgeflow-web
  namespace: forgeflow
spec:
  selector:
    app.kubernetes.io/name: forgeflow-web
  ports:
    - { name: http, port: 80, targetPort: http }

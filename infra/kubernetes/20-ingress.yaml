apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forgeflow
  namespace: forgeflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 52m
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [forgeflow.example.com]
      secretName: forgeflow-tls
  rules:
    - host: forgeflow.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8080 } }
          - path: /health
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 8080 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: forgeflow-web, port: { number: 80 } }

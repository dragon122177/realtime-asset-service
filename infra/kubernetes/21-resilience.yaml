apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forgeflow-api
  namespace: forgeflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forgeflow-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forgeflow-worker
  namespace: forgeflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forgeflow-worker
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: forgeflow-api
  namespace: forgeflow
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: forgeflow-api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: forgeflow-worker
  namespace: forgeflow
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: forgeflow-worker }

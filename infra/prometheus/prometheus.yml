global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: forgeflow-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8080']
        labels:
          service: forgeflow-api
          environment: local-compose
  - job_name: forgeflow-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9092']
        labels:
          service: forgeflow-worker
          environment: local-compose
